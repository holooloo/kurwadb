<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="kurwadb read path">
<title>kurwadb read path</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/></marker></defs>
<rect width="900" height="560" fill="#fcfcfb"/>
<text x="450.0" y="30" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#18181b" text-anchor="middle">A read, and how a stale replica gets fixed</text>
<text x="450.0" y="50" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#71717a" text-anchor="middle">member?(&quot;order:1029&quot;)   ·   n = 3, r = 2</text>
<rect x="60" y="74" width="300" height="52" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
<text x="210.0" y="106.25" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#18181b" text-anchor="middle">Extractor: cached?</text>
<path d="M 360 100 L 556 100" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#a)"/>
<text x="458" y="92" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">hit</text>
<rect x="556" y="80" width="284" height="40" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<text x="698.0" y="105.75" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#15803d" text-anchor="middle">true / false · 0.3 µs, no network</text>
<path d="M 210 126 L 210 152" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#a)"/>
<text x="224" y="143" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="start">miss</text>
<rect x="60" y="152" width="300" height="52" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
<text x="210.0" y="176.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#18181b" text-anchor="middle">single-flight</text>
<text x="210.0" y="192.5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle">one caller resolves, the rest wait</text>
<path d="M 210 204 L 210 230" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="60" y="230" width="780" height="152" rx="8" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
<text x="78" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#18181b" text-anchor="start">Quorum.run([A, B, C], get, need = 2)</text>
<text x="96" y="286" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#18181b" text-anchor="start">node A</text>
<text x="176" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#15803d" text-anchor="start">{alive, lamport 41}</text>
<text x="352" y="286" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="start" font-style="italic">counted</text>
<text x="96" y="318" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#18181b" text-anchor="start">node B</text>
<text x="176" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#15803d" text-anchor="start">{alive, lamport 41}</text>
<text x="352" y="318" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="start" font-style="italic">counted</text>
<text x="96" y="350" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#18181b" text-anchor="start">node C</text>
<text x="176" y="350" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="start">{alive, lamport 12}</text>
<text x="352" y="350" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="start" font-style="italic">stale — answered, and behind</text>
<path d="M 450 382 L 450 406" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="210" y="406" width="480" height="50" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
<text x="450.0" y="429.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#18181b" text-anchor="middle">merge — highest {lamport, node} wins</text>
<text x="450.0" y="445.5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle">a total order, so no siblings and nothing to ask the caller</text>
<path d="M 640 406 L 640 350 L 600 350" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
<text x="664" y="342" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="start">read repair</text>
<text x="664" y="358" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="start">pushes the winner back</text>
<path d="M 450 456 L 450 484" fill="none" stroke="#15803d" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="310" y="484" width="280" height="42" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<text x="450.0" y="511.25" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="middle">true</text>
<rect x="60" y="484" width="230" height="42" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="175.0" y="502.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#b91c1c" text-anchor="middle">quorum not reachable</text>
<text x="175.0" y="519.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="500" fill="#b91c1c" text-anchor="middle">→ 503, never a false</text>
<text x="725" y="500" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle" font-style="italic">cached for next time —</text>
<text x="725" y="514" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle" font-style="italic">positive and negative TTLs differ</text>
</svg>
