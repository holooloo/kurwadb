<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="kurwadb write path">
<title>kurwadb write path</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/></marker></defs>
<rect width="900" height="560" fill="#fcfcfb"/>
<text x="450.0" y="30" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#18181b" text-anchor="middle">A write, with one replica down</text>
<text x="450.0" y="50" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#71717a" text-anchor="middle">add(&quot;order:1029&quot;)   ·   n = 3, w = 2</text>
<rect x="172" y="74" width="156" height="28" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
<text x="250" y="93" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#18181b" text-anchor="middle">coordinator</text>
<line x1="250" y1="102" x2="250" y2="492" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="362" y="74" width="156" height="28" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
<text x="440" y="93" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">node A</text>
<line x1="440" y1="102" x2="440" y2="492" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="542" y="74" width="156" height="28" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
<text x="620" y="93" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">node B</text>
<line x1="620" y1="102" x2="620" y2="492" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="722" y="74" width="156" height="28" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
<text x="800" y="93" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">node C</text>
<line x1="800" y1="102" x2="800" y2="492" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="3 4"/>
<text x="800" y="118" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#b91c1c" text-anchor="middle" font-style="italic">unreachable</text>
<text x="20" y="144" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">1</text>
<text x="36" y="144" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#18181b" text-anchor="start">Clock.tick()</text>
<text x="36" y="159" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="start">a Lamport stamp, not wall-clock time</text>
<text x="20" y="180" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">2</text>
<text x="36" y="180" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#18181b" text-anchor="start">Placement.targets(key, 3)</text>
<text x="36" y="195" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="start">primaries A B C · up A B · down C</text>
<text x="20" y="216" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">3</text>
<text x="36" y="216" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#18181b" text-anchor="start">one record, stamped once</text>
<text x="36" y="231" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="start">every replica stores identical bytes</text>
<line x1="250" y1="250" x2="440" y2="250" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
<text x="345" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#b45309" text-anchor="middle">put</text>
<line x1="250" y1="276" x2="620" y2="276" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
<text x="435" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#b45309" text-anchor="middle">put</text>
<line x1="250" y1="302" x2="740" y2="302" stroke="#d4d4d8" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="772" y="306" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#b91c1c" text-anchor="middle">✕</text>
<rect x="352.91999999999996" y="285.5" width="284.16" height="18.5" rx="3" fill="#fcfcfb"/>
<text x="495" y="296" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle" font-style="italic">skipped — nothing to send to a node that is down</text>
<line x1="440" y1="328" x2="250" y2="328" stroke="#15803d" stroke-width="1.4" marker-end="url(#a)"/>
<text x="345" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#15803d" text-anchor="middle">ok</text>
<line x1="620" y1="348" x2="250" y2="348" stroke="#15803d" stroke-width="1.4" marker-end="url(#a)"/>
<text x="435" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#15803d" text-anchor="middle">ok</text>
<rect x="60" y="366" width="520" height="38" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
<text x="76" y="390" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#15803d" text-anchor="start">2 of 2 acked — w satisfied  →  :ok to the client</text>
<line x1="250" y1="428" x2="790" y2="428" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)"/>
<rect x="422.65" y="411.5" width="194.7" height="18.5" rx="3" fill="#fcfcfb"/>
<text x="520" y="422" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#b45309" text-anchor="middle">Handoff.store(node C, record)</text>
<rect x="377.91999999999996" y="429.5" width="284.16" height="18.5" rx="3" fill="#fcfcfb"/>
<text x="520" y="440" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle" font-style="italic">C owes this write, and the coordinator remembers</text>
<rect x="60" y="460" width="780" height="64" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="76" y="482" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="start">later — node C comes back</text>
<text x="76" y="500" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#18181b" text-anchor="start">Cluster publishes it as reachable → Handoff kicks → the record replays → queue empty.</text>
<text x="76" y="516" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="start">No read, no operator step, no repair tool. Placement never moved, so C was still responsible.</text>
</svg>
