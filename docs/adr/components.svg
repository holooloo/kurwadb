<rect x="460" y="140" width="370" height="44" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
<text x="645.0" y="168.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#18181b" text-anchor="middle">NineP.Server</text>
