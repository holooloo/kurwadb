<text x="255.0" y="110.25" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#71717a" text-anchor="middle">PUT / GET / DELETE  /k/:key</text>
<rect x="460" y="72" width="370" height="46" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
<text x="645.0" y="93.25" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#18181b" text-anchor="middle">9P mount</text>
<text x="645.0" y="110.25" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#71717a" text-anchor="middle">ls · cat · stat — no client library</text>
