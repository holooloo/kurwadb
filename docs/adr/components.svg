<text x="450.0" y="327.25" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#71717a" text-anchor="middle">cache + single-flight</text>
<text x="450.0" y="343.75" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle">cache hit ≈ 0.3 µs · 1000 concurrent misses → 1 quorum read</text>
<line x1="450" y1="356" x2="450" y2="374" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="130" y="376" width="640" height="116" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="150" y="398" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="600" fill="#b45309" text-anchor="start">Kurwa.Coordinator</text>
<text x="150" y="414" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#71717a" text-anchor="start">leaderless — any node coordinates any key</text>
<rect x="146" y="424" width="190" height="54" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
