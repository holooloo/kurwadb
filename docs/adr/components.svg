<text x="241.0" y="473.5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle">who is reachable · 0.3 µs</text>
<rect x="352" y="424" width="190" height="54" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
<text x="447.0" y="440.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#18181b" text-anchor="middle">Quorum</text>
<text x="447.0" y="457.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle">first 2 of 3 to answer</text>
<text x="447.0" y="473.5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle">1.8 µs</text>
<rect x="558" y="424" width="196" height="54" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
<text x="656.0" y="440.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="500" fill="#18181b" text-anchor="middle">Handoff</text>
<text x="656.0" y="457.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle">what a down replica</text>
<text x="656.0" y="473.5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#71717a" text-anchor="middle">missed, per node</text>
